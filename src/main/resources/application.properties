quarkus:
  application:
    name: SADM
    version: 1.0-SNAPSHOT

  # HTTP
  http:
    port: 8860
    host: localhost
    root-path: kick
    cors: true
    cors-origins: '*'
    cors-methods: GET,POST,PUT,DELETE,OPTIONS
    cors-headers: Content-Type,Authorization,X-Requested-With


    # Base de datos
  datasource:
    db-kind: postgresql
    username: 
    password: 
    jdbc:
      url: jdbc:postgresql


  # Hibernate-hibernate-orm:
  hibernate-orm:
    schema-management:
      strategy:
        drop-and-create
    log:
      sql: true


  # Configuracion de Logs
  log:
    level: INFO
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      dark-launch: true

    file:
      enabled: true
      path: logs/gdocentes.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 5M # Tamaño máximo
        max-backup-index: 5 # Archivos conservados
        file-suffix: yyyy-MM-dd #Sufijo de retación

  swagger-ui:
    enabled: true
    always-include: true
    path: "/swager-ui"
    title: "SADM"
    description: "API generado en Quarkus para SADM"
    version: "V1"
    contact-name: ""

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "SADM"
          version: "1.1.0"